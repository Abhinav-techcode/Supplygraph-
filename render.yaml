# Render Blueprint (free): one Docker web service. The database is a free Neon Postgres created separately
# (Render's own free Postgres expires after 30 days). Vaadin UI and backend are the same app.
services:
  - type: web
    name: supplygraph
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_FLYWAY_ENABLED
        value: "true"
      - key: SERVER_PORT
        value: "8080"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx300m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"   # the free tier has 512 MB of RAM
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: SPRING_DATASOURCE_URL
        sync: false   # from Neon: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SUPPLYGRAPH_ADMIN_PASSWORD
        sync: false
