spring:
  datasource:
    url: jdbc:h2:mem:supplygraph_local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect


supplygraph:
  auth:
    required: true
    seed-demo-users: true        # local only: creates demo accounts so you can sign in
    show-demo-accounts: true     # local only: lists them on the sign-in page
    demo-password: Demo!2026
  ui:
    demo-role-switcher: false
